version: 2

# Passive dependency updates for the WS-2 library and the GitHub Actions
# workflows. Monthly cadence keeps update PRs from drowning the review
# queue while still surfacing CVE-class upgrades in reasonable time.
#
# Per CONTRIBUTING.md, Dependabot PRs touching `pyproject.toml`
# dependencies are Tier B (one maintainer sign-off) unless they affect
# `numpy` or `scipy` major version — in which case they are Tier A
# (two of three sign-offs) because both packages can move credential
# numerical reproducibility.

updates:
  - package-ecosystem: pip
    directory: /WS-2_framework/pwm_dose_equivalence
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - WS-2
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "deps(ci)"
