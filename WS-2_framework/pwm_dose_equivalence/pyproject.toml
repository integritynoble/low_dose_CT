[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwm_dose_equivalence"
version = "0.2.2"
description = "Reference implementation of the signal-equivalence framework for medical-imaging dose-reduction claims (CT / MRI / PET)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "PWM Protocol Foundation" }
]
keywords = ["medical imaging", "low-dose CT", "MRI", "PET", "equivalence testing", "TOST", "bootstrap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "jsonschema>=4"]
# ruff is pinned to a compatible release, not floored. An open `>=` floor made
# CI's verdict a property of the day rather than of the tree: the same commit
# reported 7 findings under ruff 0.16.6 and 19 under 0.5.7, because the rule
# set moves between minor versions. Bump this deliberately, with the findings
# the new version brings fixed in the same change.
lint = ["ruff~=0.16.6", "mypy>=1.8"]

[project.scripts]
pwm-audit = "pwm_dose_equivalence.cli:main"

[project.urls]
Homepage = "https://github.com/integritynoble/low_dose_CT/tree/main/WS-2_framework"
Repository = "https://github.com/integritynoble/low_dose_CT"
Issues = "https://github.com/integritynoble/low_dose_CT/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Backs the CONTRIBUTING.md "PEP 8 with ruff defaults" claim. Default ruff
# rules (E, F) cover pycodestyle errors + pyflakes; we add `I` (isort) and
# `UP` (pyupgrade) because they catch common style drift in a typed
# scientific-Python package without adding maintenance noise.
select = ["E", "F", "I", "UP"]

[tool.mypy]
# Backs the CONTRIBUTING.md "mypy --strict should pass on the src/ tree"
# claim. scipy does not publish type stubs as of 2026; until it does we
# allow imports from the scipy.* namespace to be untyped without erroring.
strict = true
python_version = "3.10"
files = ["src/pwm_dose_equivalence"]

# Both patterns, for the reason spelled out in the numpy block below:
# "scipy.*" does not match the top-level `scipy` module. Latent rather than
# broken today, since the code imports scipy.stats, but the same shape.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

# numpy's published stubs use PEP 695 `type` statements, which mypy will only
# parse when python_version is 3.12 or later. This package still declares and
# tests 3.10, so raising python_version to satisfy the stubs would stop mypy
# checking the version range CI actually runs. Skipping the stubs keeps the
# 3.10 target honest at the cost of numpy expressions typing as Any. Revisit
# when the floor moves to 3.12: delete this block rather than keeping it.
# "numpy.*" alone does not match the top-level `numpy` module, and
# numpy/__init__.pyi is exactly where the unparseable statement is, so both
# patterns are needed.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
# follow_imports does not apply to .pyi files unless this is set, and the
# unparseable statement is in a stub, so without it the skip has no effect.
follow_imports_for_stubs = true
ignore_missing_imports = true
