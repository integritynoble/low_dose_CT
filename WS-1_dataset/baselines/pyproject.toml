[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pwm_ldct_baselines"
version = "0.5.0"
description = "Reproducible reconstruction-baseline harness (RED-CNN + pluggable methods) for PWM-LDCT v0.5."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "PWM-LDCT authors" }]
dependencies = ["numpy>=1.21", "torch>=1.12", "pwm_ldct_loader>=0.5.0"]

[project.optional-dependencies]
lpips = ["lpips>=0.1"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
