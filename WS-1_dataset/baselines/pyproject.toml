[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pwm_ldct_baselines"
version = "0.5.0"
description = "Reproducible reconstruction-baseline harness (RED-CNN + pluggable methods) for PWM-LDCT v0.5."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "PWM-LDCT authors" }]
dependencies = ["numpy>=1.21", "torch>=1.12", "pwm_ldct_loader>=0.5.0"]

[project.optional-dependencies]
# Third-environment (Blackwell / RTX 50-series) compute extra: PyTorch 2.7.0 is the
# first stable release with native sm_120 support and ships CUDA 12.8+ wheels.
# The legacy cu121 (2.3.0) environments remain valid via the base `torch>=1.12`.
blackwell = ["torch>=2.7.0", "torchvision>=0.22.0"]
lpips = ["lpips>=0.1"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
